<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilal's Inventory Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.4) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.4) 0%, transparent 50%);
            z-index: -1;
        }
        .status { position: fixed; top: 20px; right: 20px; padding: 8px 16px; border-radius: 20px; 
                  font-size: 0.85em; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
                  border: 1px solid rgba(255,255,255,0.2); display: flex; gap: 8px; z-index: 1000; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .connected { background: #10b981; }
        .syncing { background: #f59e0b; }
        .container { max-width: 1600px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, rgba(120, 119, 198, 0.2) 0%, rgba(72, 191, 227, 0.2) 100%);
            backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px; padding: 50px 30px; text-align: center; margin-bottom: 30px;
        }
        .header h1 {
            font-size: 3em; font-weight: 700;
            background: linear-gradient(135deg, #7877c6 0%, #48bfe3 50%, #ff77c6 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { color: rgba(255, 255, 255, 0.7); font-size: 1.1em; margin-top: 10px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: linear-gradient(135deg, rgba(120, 119, 198, 0.15) 0%, rgba(72, 191, 227, 0.15) 100%);
            backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px; border-radius: 20px; text-align: center; transition: all 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h3 {
            font-size: 2.5em; font-weight: 700;
            background: linear-gradient(135deg, #7877c6 0%, #48bfe3 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;
        }
        .stat-card p { color: rgba(255, 255, 255, 0.6); font-size: 0.9em; text-transform: uppercase; }
        .controls {
            background: linear-gradient(135deg, rgba(120, 119, 198, 0.15) 0%, rgba(72, 191, 227, 0.15) 100%);
            backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px; border-radius: 20px; display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 30px;
        }
        .btn {
            padding: 14px 28px; border: none; border-radius: 12px; font-size: 1em;
            font-weight: 600; cursor: pointer; transition: all 0.3s; font-family: 'Poppins', sans-serif;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .btn-primary { background: linear-gradient(135deg, #7877c6 0%, #48bfe3 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary { background: linear-gradient(135deg, #48bfe3 0%, #5eead4 100%); color: white; }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%); color: white; }
        .search-box {
            flex: 1; min-width: 250px; padding: 14px 20px; border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; font-size: 1em; font-family: 'Poppins', sans-serif;
            background: rgba(255, 255, 255, 0.05); color: white;
        }
        .search-box::placeholder { color: rgba(255, 255, 255, 0.5); }
        .search-box:focus { outline: none; border-color: #48bfe3; background: rgba(255, 255, 255, 0.1); }
        .table-container {
            background: linear-gradient(135deg, rgba(120, 119, 198, 0.15) 0%, rgba(72, 191, 227, 0.15) 100%);
            backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px; border-radius: 20px; overflow-x: auto;
        }
        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        thead tr { background: linear-gradient(135deg, rgba(120, 119, 198, 0.3) 0%, rgba(72, 191, 227, 0.3) 100%); }
        th { padding: 18px; text-align: left; font-weight: 600; color: white; cursor: pointer; }
        th:first-child { border-radius: 12px 0 0 12px; }
        th:last-child { border-radius: 0 12px 12px 0; }
        tbody tr { background: rgba(255, 255, 255, 0.03); transition: all 0.3s; }
        tbody tr:hover { background: rgba(255, 255, 255, 0.08); }
        td { padding: 18px; color: rgba(255, 255, 255, 0.9); }
        .badge { padding: 6px 14px; border-radius: 15px; font-size: 0.8em; font-weight: 600; }
        .in-stock { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
        .low-stock { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; }
        .out-stock { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; }
        .action-btns { display: flex; gap: 8px; }
        .btn-small { padding: 8px 16px; font-size: 0.8em; border-radius: 8px; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 1000; backdrop-filter: blur(10px);
        }
        .modal-content {
            background: linear-gradient(135deg, rgba(15, 15, 35, 0.95) 0%, rgba(30, 30, 60, 0.95) 100%);
            backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px; max-height: 90vh; margin: 30px auto; padding: 40px;
            border-radius: 25px; position: relative; overflow-y: auto;
        }
        .modal-header h2 {
            font-size: 2em; font-weight: 700;
            background: linear-gradient(135deg, #7877c6 0%, #48bfe3 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 30px;
        }
        .close {
            position: absolute; top: 20px; right: 25px; font-size: 30px; cursor: pointer;
            color: rgba(255, 255, 255, 0.5); transition: all 0.3s;
        }
        .close:hover { color: white; transform: rotate(90deg); }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; margin-bottom: 8px; font-weight: 600; color: rgba(255, 255, 255, 0.9);
            font-size: 0.9em; text-transform: uppercase;
        }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 18px; border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; font-size: 1em; font-family: 'Poppins', sans-serif;
            background: rgba(255, 255, 255, 0.05); color: white;
        }
        .form-group input::placeholder, .form-group textarea::placeholder { color: rgba(255, 255, 255, 0.4); }
        .form-group input:focus, .form-group textarea:focus {
            outline: none; border-color: #48bfe3; background: rgba(255, 255, 255, 0.1);
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-actions { display: flex; gap: 12px; margin-top: 30px; }
        .form-actions .btn { flex: 1; }
        .empty { text-align: center; padding: 60px 20px; color: rgba(255, 255, 255, 0.5); }
        .empty h3 {
            font-size: 1.5em; margin-bottom: 10px;
            background: linear-gradient(135deg, #7877c6 0%, #48bfe3 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .controls { flex-direction: column; }
            .search-box { min-width: 100%; }
            .btn { width: 100%; }
            body { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="status">
        <div class="dot syncing" id="dot"></div>
        <span id="statusText">Connecting...</span>
    </div>

    <div class="container">
        <div class="header">
            <h1>Bilal's Inventory System</h1>
            <p>Real-Time Shared Inventory</p>
        </div>

        <div class="stats">
            <div class="stat-card"><h3 id="totalItems">0</h3><p>Total Products</p></div>
            <div class="stat-card"><h3 id="totalValue">£0</h3><p>Inventory Value</p></div>
            <div class="stat-card"><h3 id="lowStockCount">0</h3><p>Low Stock</p></div>
            <div class="stat-card"><h3 id="outOfStockCount">0</h3><p>Out of Stock</p></div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="openModal()">✚ Add New Item</button>
            <button class="btn btn-secondary" onclick="exportData()">💾 Export</button>
            <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📂 Import</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search..." oninput="filterItems()">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortTable('name')">Product</th>
                        <th onclick="sortTable('sku')">SKU</th>
                        <th onclick="sortTable('quantity')">Qty</th>
                        <th onclick="sortTable('price')">Price</th>
                        <th onclick="sortTable('category')">Category</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="body">
                    <tr><td colspan="7" class="empty"><h3>🎯 Ready</h3><p>Click "Add New Item"</p></td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-header"><h2 id="modalTitle">Add New Item</h2></div>
            <form id="form" onsubmit="saveItem(event)">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="name" placeholder="Product name" required>
                </div>
                <div class="form-group">
                    <label>SKU</label>
                    <input type="text" id="sku" placeholder="e.g., PROD-001">
                </div>
                <div class="form-group">
                    <label>Quantity *</label>
                    <input type="number" id="qty" placeholder="0" min="0" required>
                </div>
                <div class="form-group">
                    <label>Price (£) *</label>
                    <input type="number" id="price" placeholder="0.00" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <input type="text" id="cat" placeholder="e.g., Electronics" required>
                </div>
                <div class="form-group">
                    <label>Low Stock Alert</label>
                    <input type="number" id="low" placeholder="10" value="10" min="0">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="desc" placeholder="Details..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">💾 Save</button>
                    <button type="button" class="btn btn-danger" onclick="closeModal()">✖ Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import{initializeApp as i}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import{getFirestore as g,collection as c,addDoc as a,updateDoc as u,deleteDoc as d,doc as D,onSnapshot as o,getDocs as G,query as q}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const f=i({apiKey:"AIzaSyCfwP5ujletDJ0IYb7KG80JDcDXXx-A_vA",authDomain:"bilal-inventory.firebaseapp.com",projectId:"bilal-inventory",storageBucket:"bilal-inventory.firebasestorage.app",messagingSenderId:"89499578022",appId:"1:89499578022:web:775dc112e8b203e02b8e67"});
        const db=g(f);
        let editId=null,sort={column:'name',asc:true},items=[];

        function status(s,t){
            document.getElementById('dot').className=`dot ${s}`;
            document.getElementById('statusText').textContent=t;
        }

        function display(arr){
            const b=document.getElementById('body');
            if(!arr.length){b.innerHTML='<tr><td colspan="7" class="empty"><h3>🎯 Ready</h3><p>Click "Add New Item"</p></td></tr>';return;}
            b.innerHTML=arr.map(m=>{
                const st=m.quantity===0?{t:'Out',c:'out-stock'}:m.quantity<=m.lowStock?{t:'Low',c:'low-stock'}:{t:'In Stock',c:'in-stock'};
                return`<tr><td><strong>${m.name}</strong></td><td>${m.sku}</td><td>${m.quantity}</td><td>£${parseFloat(m.price).toFixed(2)}</td><td>${m.category}</td><td><span class="badge ${st.c}">${st.t}</span></td><td class="action-btns"><button class="btn btn-primary btn-small" onclick="window.edit('${m.id}')">Edit</button><button class="btn btn-danger btn-small" onclick="window.del('${m.id}')">Delete</button></td></tr>`;
            }).join('');
        }

        function stats(arr){
            document.getElementById('totalItems').textContent=arr.length;
            const t=arr.reduce((s,i)=>s+(i.price*i.quantity),0);
            document.getElementById('totalValue').textContent='£'+t.toFixed(2);
            document.getElementById('lowStockCount').textContent=arr.filter(i=>i.quantity>0&&i.quantity<=i.lowStock).length;
            document.getElementById('outOfStockCount').textContent=arr.filter(i=>i.quantity===0).length;
        }

        o(q(c(db,'inventory')),s=>{
            items=[];
            s.forEach(d=>items.push({id:d.id,...d.data()}));
            display(items);stats(items);status('connected','Connected');
        },e=>{console.error(e);status('syncing','Offline');});

        window.openModal=function(id=null){
            editId=id;
            document.getElementById('modalTitle').textContent=id?'Edit Item':'Add New Item';
            if(id){
                const m=items.find(i=>i.id===id);
                if(m){
                    document.getElementById('name').value=m.name;
                    document.getElementById('sku').value=m.sku;
                    document.getElementById('qty').value=m.quantity;
                    document.getElementById('price').value=m.price;
                    document.getElementById('cat').value=m.category;
                    document.getElementById('low').value=m.lowStock;
                    document.getElementById('desc').value=m.description||'';
                }
            }else document.getElementById('form').reset();
            document.getElementById('modal').style.display='block';
        };

        window.closeModal=()=>{document.getElementById('modal').style.display='none';editId=null;};

        window.saveItem=async function(e){
            e.preventDefault();status('syncing','Saving...');
            const m={name:document.getElementById('name').value,sku:document.getElementById('sku').value||`AUTO-${Date.now()}`,quantity:parseInt(document.getElementById('qty').value),price:parseFloat(document.getElementById('price').value),category:document.getElementById('cat').value,lowStock:parseInt(document.getElementById('low').value),description:document.getElementById('desc').value,lastUpdated:new Date().toISOString()};
            try{
                if(editId)await u(D(db,'inventory',editId),m);
                else await a(c(db,'inventory'),m);
                window.closeModal();
            }catch(er){alert('Save error');status('connected','Connected');}
        };

        window.edit=id=>window.openModal(id);
        window.del=async id=>{if(confirm('Delete?')){status('syncing','Deleting...');try{await d(D(db,'inventory',id));}catch(e){alert('Delete error');}}};

        window.sortTable=col=>{
            if(sort.column===col)sort.asc=!sort.asc;else{sort.column=col;sort.asc=true;}
            const s=[...items].sort((a,b)=>{let av=a[col],bv=b[col];if(typeof av==='string'){av=av.toLowerCase();bv=bv.toLowerCase();}return sort.asc?(av>bv?1:-1):(av<bv?1:-1);});
            display(s);
        };

        window.filterItems=()=>{
            const s=document.getElementById('searchBox').value.toLowerCase();
            const f=items.filter(i=>i.name.toLowerCase().includes(s)||i.sku.toLowerCase().includes(s)||i.category.toLowerCase().includes(s));
            display(f);
        };

        window.exportData=async()=>{
            status('syncing','Exporting...');
            try{
                const s=await G(c(db,'inventory')),arr=[];
                s.forEach(d=>arr.push({id:d.id,...d.data()}));
                const data=JSON.stringify(arr,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
                a.href=url;a.download=`bilal-inventory-${new Date().toISOString().split('T')[0]}.json`;a.click();URL.revokeObjectURL(url);
                status('connected','Connected');
            }catch(e){alert('Export failed');status('connected','Connected');}
        };

        window.importData=e=>{
            const file=e.target.files[0];if(!file)return;
            const choice=confirm('OK=Merge items\nCancel=Clear all & import');
            const reader=new FileReader();
            reader.onload=async ev=>{
                try{
                    const arr=JSON.parse(ev.target.result);
                    if(!Array.isArray(arr)){alert('Invalid file');return;}
                    status('syncing','Importing...');
                    if(!choice){
                        const s=await G(c(db,'inventory'));
                        for(const doc of s.docs)await d(D(db,'inventory',doc.id));
                    }
                    for(const item of arr){
                        const m={name:item.name,sku:item.sku||`AUTO-${Date.now()}-${Math.random()}`,quantity:item.quantity,price:item.price,category:item.category,lowStock:item.lowStock,description:item.description||'',lastUpdated:new Date().toISOString()};
                        await a(c(db,'inventory'),m);
                    }
                    alert(`Imported ${arr.length} items!`);
                    document.getElementById('importFile').value='';
                }catch(er){alert('Import failed');}
            };
            reader.readAsText(file);
        };

        window.onclick=e=>{if(e.target.id==='modal')window.closeModal();};
    </script>
</body>
</html>
