<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilal's Inventory Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 40% 90%, rgba(72, 191, 227, 0.4) 0%, transparent 50%);
            z-index: -1;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, rgba(120, 119, 198, 0.2) 0%, rgba(72, 191, 227, 0.2) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 50px 30px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .header h1 {
            font-size: 3em;
            font-weight: 700;
            background: linear-gradient(135deg, #7877c6 0%, #48bfe3 50%, #ff77c6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px rgba(120, 119, 198, 0.5)); }
            to { filter: drop-shadow(0 0 20px rgba(72, 191, 227, 0.8)); }
        }

        .header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(120, 119, 198, 0.15) 0%, rgba(72, 191, 227, 0.15) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(72, 191, 227, 0.4);
        }

        .stat-card h3 {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #7877c6 0%, #48bfe3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .stat-card p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            background: linear-gradient(135deg, rgba(120, 119, 198, 0.15) 0%, rgba(72, 191, 227, 0.15) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #7877c6 0%, #48bfe3 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(120, 119, 198, 0.5);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #48bfe3 0%, #5eead4 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(72, 191, 227, 0.5);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.5);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 14px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            transition: all 0.3s;
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-box:focus {
            outline: none;
            border-color: #48bfe3;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(72, 191, 227, 0.3);
        }

        .table-container {
            background: linear-gradient(135deg, rgba(120, 119, 198, 0.15) 0%, rgba(72, 191, 227, 0.15) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        thead tr {
            background: linear-gradient(135deg, rgba(120, 119, 198, 0.3) 0%, rgba(72, 191, 227, 0.3) 100%);
        }

        th {
            padding: 18px;
            text-align: left;
            font-weight: 600;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85em;
        }

        th:first-child { border-radius: 12px 0 0 12px; }
        th:last-child { border-radius: 0 12px 12px 0; }
        th:hover { background: rgba(72, 191, 227, 0.4); }

        tbody tr {
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.3s;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.01);
        }

        td {
            padding: 18px;
            color: rgba(255, 255, 255, 0.9);
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-in-stock {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .status-low-stock {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .status-out-of-stock {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.8em;
            border-radius: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            backdrop-filter: blur(10px);
            -webkit-overflow-scrolling: touch;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(15, 15, 35, 0.95) 0%, rgba(30, 30, 60, 0.95) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            max-height: 90vh;
            margin: 30px auto;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow-y: auto;
        }

        .modal-header h2 {
            font-size: 2em;
            font-weight: 700;
            background: linear-gradient(135deg, #7877c6 0%, #48bfe3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 30px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
        }

        .close:hover {
            color: white;
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            transition: all 0.3s;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #48bfe3;
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .form-actions .btn {
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.5);
        }

        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #7877c6 0%, #48bfe3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .controls { flex-direction: column; }
            .search-box { min-width: 100%; }
            .modal-content { 
                margin: 10px; 
                padding: 30px 20px;
                max-height: 85vh;
            }
            .btn {
                width: 100%;
                padding: 16px 28px;
                font-size: 1.1em;
            }
            .controls .btn {
                width: 100%;
            }
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Bilal's Inventory System</h1>
            <p>Premium Inventory Management</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3 id="totalItems">0</h3>
                <p>Total Products</p>
            </div>
            <div class="stat-card">
                <h3 id="totalValue">£0</h3>
                <p>Inventory Value</p>
            </div>
            <div class="stat-card">
                <h3 id="lowStockCount">0</h3>
                <p>Low Stock</p>
            </div>
            <div class="stat-card">
                <h3 id="outOfStockCount">0</h3>
                <p>Out of Stock</p>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="openModal()">✚ Add New Item</button>
            <button class="btn btn-secondary" onclick="exportData()">💾 Export</button>
            <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📂 Import</button>
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search inventory..." oninput="filterItems()">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th onclick="sortTable('name')">Product Name</th>
                        <th onclick="sortTable('sku')">SKU</th>
                        <th onclick="sortTable('quantity')">Quantity</th>
                        <th onclick="sortTable('price')">Price</th>
                        <th onclick="sortTable('category')">Category</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody">
                    <tr>
                        <td colspan="7" class="empty-state">
                            <h3>🎯 Ready to Start</h3>
                            <p>Click "Add New Item" to begin</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="itemModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-header">
                <h2 id="modalTitle">Add New Item</h2>
            </div>
            <form id="itemForm" onsubmit="saveItem(event)">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="itemName" placeholder="Product name" required>
                </div>
                <div class="form-group">
                    <label>SKU</label>
                    <input type="text" id="itemSku" placeholder="e.g., PROD-001">
                </div>
                <div class="form-group">
                    <label>Quantity *</label>
                    <input type="number" id="itemQuantity" placeholder="0" min="0" required>
                </div>
                <div class="form-group">
                    <label>Price (£) *</label>
                    <input type="number" id="itemPrice" placeholder="0.00" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <input type="text" id="itemCategory" placeholder="e.g., Electronics" required>
                </div>
                <div class="form-group">
                    <label>Low Stock Alert</label>
                    <input type="number" id="itemLowStock" placeholder="10" value="10" min="0">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="itemDescription" placeholder="Additional details..."></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">💾 Save</button>
                    <button type="button" class="btn btn-danger" onclick="closeModal()">✖ Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let db;
        let editingId = null;
        let currentSort = { column: 'name', ascending: true };

        function initDB() {
            const request = indexedDB.open('BilalInventoryDB', 1);
            
            request.onerror = () => console.error('DB error');
            
            request.onsuccess = () => {
                db = request.result;
                loadInventory();
            };
            
            request.onupgradeneeded = (e) => {
                db = e.target.result;
                const store = db.createObjectStore('items', { keyPath: 'id', autoIncrement: true });
                store.createIndex('name', 'name', { unique: false });
                store.createIndex('category', 'category', { unique: false });
            };
        }

        function loadInventory() {
            const tx = db.transaction(['items'], 'readonly');
            const store = tx.objectStore('items');
            const req = store.getAll();
            
            req.onsuccess = () => {
                displayInventory(req.result);
                updateStats(req.result);
            };
        }

        function displayInventory(items) {
            const tbody = document.getElementById('inventoryBody');
            
            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state"><h3>🎯 Ready to Start</h3><p>Click "Add New Item"</p></td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(item => {
                const status = getStatus(item.quantity, item.lowStock);
                return `
                    <tr>
                        <td><strong>${item.name}</strong></td>
                        <td>${item.sku}</td>
                        <td>${item.quantity}</td>
                        <td>£${parseFloat(item.price).toFixed(2)}</td>
                        <td>${item.category}</td>
                        <td><span class="status-badge status-${status.class}">${status.text}</span></td>
                        <td class="action-btns">
                            <button class="btn btn-primary btn-small" onclick="editItem(${item.id})">Edit</button>
                            <button class="btn btn-danger btn-small" onclick="deleteItem(${item.id})">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function getStatus(qty, low) {
            if (qty === 0) return { text: 'Out', class: 'out-of-stock' };
            if (qty <= low) return { text: 'Low', class: 'low-stock' };
            return { text: 'In Stock', class: 'in-stock' };
        }

        function updateStats(items) {
            document.getElementById('totalItems').textContent = items.length;
            const total = items.reduce((s, i) => s + (i.price * i.quantity), 0);
            document.getElementById('totalValue').textContent = '£' + total.toFixed(2);
            document.getElementById('lowStockCount').textContent = items.filter(i => i.quantity > 0 && i.quantity <= i.lowStock).length;
            document.getElementById('outOfStockCount').textContent = items.filter(i => i.quantity === 0).length;
        }

        function openModal(id = null) {
            editingId = id;
            document.getElementById('modalTitle').textContent = id ? 'Edit Item' : 'Add New Item';
            
            if (id) {
                const tx = db.transaction(['items'], 'readonly');
                const req = tx.objectStore('items').get(id);
                req.onsuccess = () => {
                    const item = req.result;
                    document.getElementById('itemName').value = item.name;
                    document.getElementById('itemSku').value = item.sku;
                    document.getElementById('itemQuantity').value = item.quantity;
                    document.getElementById('itemPrice').value = item.price;
                    document.getElementById('itemCategory').value = item.category;
                    document.getElementById('itemLowStock').value = item.lowStock;
                    document.getElementById('itemDescription').value = item.description || '';
                };
            } else {
                document.getElementById('itemForm').reset();
            }
            
            document.getElementById('itemModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('itemModal').style.display = 'none';
            editingId = null;
        }

        function saveItem(e) {
            e.preventDefault();
            
            const item = {
                name: document.getElementById('itemName').value,
                sku: document.getElementById('itemSku').value || `AUTO-${Date.now()}`,
                quantity: parseInt(document.getElementById('itemQuantity').value),
                price: parseFloat(document.getElementById('itemPrice').value),
                category: document.getElementById('itemCategory').value,
                lowStock: parseInt(document.getElementById('itemLowStock').value),
                description: document.getElementById('itemDescription').value,
                lastUpdated: new Date().toISOString()
            };

            const tx = db.transaction(['items'], 'readwrite');
            const store = tx.objectStore('items');
            
            let request;
            if (editingId) {
                item.id = editingId;
                request = store.put(item);
            } else {
                request = store.add(item);
            }
            
            request.onsuccess = () => {
                closeModal();
                loadInventory();
            };
            
            request.onerror = (err) => {
                console.error('Save error:', err);
                alert('Error saving item. Please try again.');
            };
        }

        function editItem(id) {
            openModal(id);
        }

        function deleteItem(id) {
            if (confirm('Delete this item?')) {
                const tx = db.transaction(['items'], 'readwrite');
                tx.objectStore('items').delete(id);
                tx.oncomplete = () => loadInventory();
            }
        }

        function sortTable(col) {
            if (currentSort.column === col) {
                currentSort.ascending = !currentSort.ascending;
            } else {
                currentSort.column = col;
                currentSort.ascending = true;
            }

            const tx = db.transaction(['items'], 'readonly');
            const req = tx.objectStore('items').getAll();
            
            req.onsuccess = () => {
                const items = req.result.sort((a, b) => {
                    let aVal = a[col];
                    let bVal = b[col];
                    if (typeof aVal === 'string') {
                        aVal = aVal.toLowerCase();
                        bVal = bVal.toLowerCase();
                    }
                    return currentSort.ascending ? (aVal > bVal ? 1 : -1) : (aVal < bVal ? 1 : -1);
                });
                displayInventory(items);
            };
        }

        function filterItems() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const tx = db.transaction(['items'], 'readonly');
            const req = tx.objectStore('items').getAll();
            
            req.onsuccess = () => {
                const filtered = req.result.filter(i => 
                    i.name.toLowerCase().includes(search) ||
                    i.sku.toLowerCase().includes(search) ||
                    i.category.toLowerCase().includes(search)
                );
                displayInventory(filtered);
            };
        }

        function exportData() {
            const tx = db.transaction(['items'], 'readonly');
            const req = tx.objectStore('items').getAll();
            
            req.onsuccess = () => {
                const data = JSON.stringify(req.result, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `bilal-inventory-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            if (!confirm('Import options:\n\nOK = Merge with existing items (updates duplicates)\nCancel = Clear all and import fresh\n\nChoose one:')) {
                // User chose Cancel - Clear all first
                const clearTx = db.transaction(['items'], 'readwrite');
                const clearStore = clearTx.objectStore('items');
                const clearReq = clearStore.clear();
                
                clearReq.onsuccess = () => {
                    // Now import after clearing
                    processImport(file);
                };
            } else {
                // User chose OK - Merge/Update
                processImport(file);
            }
        }

        function processImport(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const items = JSON.parse(event.target.result);
                    
                    if (!Array.isArray(items)) {
                        alert('Invalid file format. Please use an exported backup file.');
                        return;
                    }
                    
                    const tx = db.transaction(['items'], 'readwrite');
                    const store = tx.objectStore('items');
                    
                    let addedCount = 0;
                    let updatedCount = 0;
                    
                    // Get all existing items first
                    const getAllReq = store.getAll();
                    
                    getAllReq.onsuccess = () => {
                        const existingItems = getAllReq.result;
                        
                        items.forEach(importItem => {
                            const newItem = {
                                name: importItem.name,
                                sku: importItem.sku || `AUTO-${Date.now()}-${Math.random()}`,
                                quantity: importItem.quantity,
                                price: importItem.price,
                                category: importItem.category,
                                lowStock: importItem.lowStock,
                                description: importItem.description || '',
                                lastUpdated: new Date().toISOString()
                            };
                            
                            // Check if item with same name and SKU exists
                            const existingItem = existingItems.find(item => 
                                item.name === newItem.name && item.sku === newItem.sku
                            );
                            
                            if (existingItem) {
                                // Update existing item
                                newItem.id = existingItem.id;
                                store.put(newItem);
                                updatedCount++;
                            } else {
                                // Add new item
                                store.add(newItem);
                                addedCount++;
                            }
                        });
                        
                        tx.oncomplete = () => {
                            loadInventory();
                            alert(`Import complete!\n\nAdded: ${addedCount} new items\nUpdated: ${updatedCount} existing items`);
                            document.getElementById('importFile').value = '';
                        };
                    };
                    
                    tx.onerror = () => {
                        alert('Import failed. Please try again.');
                    };
                } catch (err) {
                    console.error(err);
                    alert('Import failed. Make sure you are using a valid backup file.');
                }
            };
            reader.readAsText(file);
        }

        window.onclick = (e) => {
            if (e.target.id === 'itemModal') closeModal();
        };

        initDB();
    </script>
</body>
</html>
